[project]
name = "natlas"
version = "0.1.0"
description = "Official Python SDK and local serving engine for N-ATLAS (Nigeria's multilingual LLM and ASR models)"
readme = "README.md"
requires-python = "~=3.13.0"
authors = [{ name = "N-ATLAS Team" }]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "uvicorn[standard]>=0.54.0",
    "fastapi[standard]>=0.143.0",
    "sse-starlette>=3.5.0",
]

[project.optional-dependencies]
audio = [
    "av>=12.0.0",
    "soundfile>=0.12.1",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "faster-whisper>=1.0.0",
    "python-multipart>=0.0.9",
    "av>=12.0.0",
]
llama = [
    "llama-cpp-python>=0.2.90",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
]

[project.scripts]
natlas = "natlas.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
